[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-finops-agent"
version = "0.1.0"
description = "Explainable, read-only Azure FinOps agent (LangGraph + MCP)."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6,<3",
  "azure-core>=1.30,<2",
  "azure-identity>=1.17,<2",
  "azure-mgmt-resourcegraph>=8,<9",
  "azure-mgmt-monitor>=7,<8",
  "azure-mgmt-costmanagement>=5,<6",
  "langgraph>=1.2,<2",
]

[project.optional-dependencies]
llm = ["openai>=1.40,<3"]  # only for `azure-finops run --explain`
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "openai>=1.40,<3"]

[project.scripts]
azure-finops = "azure_finops_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["live: needs real Azure credentials; opt-in only"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Legacy flat modules are migrated into src/ in later phases.
extend-exclude = ["agent.py", "cost_fetcher.py", "function_app.py", "idle_finder.py",
  "mcp_server.py", "summarizer.py", "teams_sender.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["openai", "openai.*"]
ignore_missing_imports = true  # optional dependency (the "llm" extra)
